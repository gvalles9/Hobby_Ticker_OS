name: Build Hobby Ticker OS Image

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'  # Weekly rebuild on Monday at 2:00 AM UTC

jobs:
  build-image:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: armhf
            image_name: hobbyticker-32bit
            pi_gen_ref: master
            runner: ubuntu-24.04
          - arch: arm64
            image_name: hobbyticker-64bit
            pi_gen_ref: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Free up disk space
        run: |
          echo "Disk space before cleanup:"
          df -h /
          # These pre-installed toolchains are not needed to build a Raspberry
          # Pi image and together use tens of GB on hosted runners.
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/share/boost \
            /usr/local/share/powershell \
            /usr/share/swift \
            /opt/microsoft \
            /opt/google
          sudo apt-get clean
          sudo docker system prune -af --volumes || true
          echo "Disk space after cleanup:"
          df -h /

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup qemu for armhf cross-build
        if: matrix.arch == 'armhf'
        run: |
          sudo apt-get update
          sudo apt-get -y install qemu-user-static binfmt-support
          sudo apt-get -y remove qemu-user-binfmt 2>/dev/null || true
          sudo ln -sf /usr/bin/qemu-arm-static /usr/local/bin/qemu-arm
          sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc 2>/dev/null || true
          echo ':qemu-arm-rpi:M::\x7fELF\x01\x01\x01\x00\x00\x00\x00\x00\x00\x00\x00\x00\x02\x00\x28\x00:\xff\xff\xff\xff\xff\xff\xff\x00\xff\xff\xff\xff\xff\xff\xff\xff\xfe\xff\xff\xff:/usr/bin/qemu-arm-static:F' | sudo tee /proc/sys/fs/binfmt_misc/register >/dev/null 2>&1 || true

      - name: Clone pi-gen and build image
        run: |
          set -e

          git clone --depth 1 -b ${{ matrix.pi_gen_ref }} https://github.com/RPi-Distro/pi-gen.git pi-gen

          curl -sL 'http://archive.raspberrypi.com/debian/pool/main/r/raspberrypi-archive-keyring/raspberrypi-archive-keyring_2025.1+rpt1_all.deb' -o /tmp/rpi-keyring.deb
          dpkg-deb -x /tmp/rpi-keyring.deb /tmp/rpi-keyring
          curl -sL 'http://raspbian.raspberrypi.com/raspbian/pool/main/r/raspbian-archive-keyring/raspbian-archive-keyring_20120528.4_all.deb' -o /tmp/raspbian-keyring.deb
          dpkg-deb -x /tmp/raspbian-keyring.deb /tmp/raspbian-keyring
          gpg --no-default-keyring --keyring /tmp/merged.gpg --import /tmp/rpi-keyring/usr/share/keyrings/raspberrypi-archive-keyring.pgp 2>/dev/null
          gpg --no-default-keyring --keyring /tmp/merged.gpg --import /tmp/raspbian-keyring/usr/share/keyrings/raspbian-archive-keyring.gpg 2>/dev/null
          gpg --no-default-keyring --keyring /tmp/merged.gpg --export > pi-gen/stage0/files/raspberrypi.gpg
          rm -rf /tmp/rpi-keyring /tmp/rpi-keyring.deb /tmp/raspbian-keyring /tmp/raspbian-keyring.deb /tmp/merged.gpg*

          cp -r stage2 pi-gen/stage-hobbyticker
          chmod +x pi-gen/stage-hobbyticker/prerun.sh pi-gen/stage-hobbyticker/00-hobbyticker/01-run.sh 2>/dev/null || true

          # SSH is intentionally disabled: pi-gen installs openssh-server but
          # runs `systemctl disable ssh` when ENABLE_SSH=0, so the giveaway
          # image has no remote login out of the box. Re-enable locally with
          # `sudo systemctl enable --now ssh` if troubleshooting is needed.
          {
            echo 'IMG_NAME="hobbyticker-os-${{ matrix.arch }}"'
            echo 'RELEASE="trixie"'
            echo 'LOCALE_DEFAULT="en_US.UTF-8"'
            echo 'TARGET_HOSTNAME="hobbyticker"'
            echo 'KEYBOARD_KEYMAP="us"'
            echo 'KEYBOARD_LAYOUT="English (US)"'
            echo 'TIMEZONE_DEFAULT="UTC"'
            echo 'FIRST_USER_NAME="pi"'
            echo 'FIRST_USER_PASS="raspberry"'
            echo 'ENABLE_SSH=0'
            echo 'STAGE_LIST="stage0 stage1 stage2 stage-hobbyticker"'
            echo 'DEPLOY_COMPRESSION="xz"'
          } > pi-gen/config

          touch pi-gen/stage-hobbyticker/EXPORT_IMAGE

          df -h /
          cd pi-gen
          # Do not preserve the build container. It holds the entire pi-gen
          # work/ tree (several GB) and would otherwise stay on disk after the
          # image has been copied out.
          ./build-docker.sh
          df -h /

      - name: Cleanup build artifacts to free disk space
        run: |
          # pi-gen runs inside Docker, so work/ lives in the container's
          # writable layer, not in pi-gen/work on the host. Removing the
          # container and dangling images is what actually frees the space.
          docker rm -fv pigen_work 2>/dev/null || true
          docker system prune -af --volumes || true
          df -h /

      - name: Prepare deploy artifacts and calculate SHA256
        run: |
          set -e
          cd pi-gen/deploy
          echo "Deploy directory contents:"
          ls -la

          # pi-gen exports one image per stage that contains EXPORT_IMAGE:
          #   <date>-<img_name>-lite.img.xz        (plain Raspberry Pi OS)
          #   <date>-<img_name>-hobbyticker.img.xz (our custom stage)
          # Select the Hobby Ticker image explicitly. Picking "the first *.img.xz"
          # is what previously published a plain Raspberry Pi OS image that
          # happened to be named hobbyticker-*.img.xz.
          IMG_XZ=$(ls *-hobbyticker.img.xz 2>/dev/null | head -n 1 || true)
          if [ -z "$IMG_XZ" ]; then
            echo "ERROR: no *-hobbyticker.img.xz was produced by pi-gen." >&2
            echo "Refusing to publish a stock Raspberry Pi OS image." >&2
            exit 1
          fi
          mv "$IMG_XZ" "${{ matrix.image_name }}.img.xz"

          sha256sum "${{ matrix.image_name }}.img.xz" > "${{ matrix.image_name }}.img.xz.sha256"
          stat -c%s "${{ matrix.image_name }}.img.xz" > "${{ matrix.image_name }}.img.xz.size"

          # Raspberry Pi Imager also uses the uncompressed image size/hash
          # (extract_size / extract_sha256 in os_list.json). deploy/ only keeps
          # the .xz, so derive them by decompressing once.
          xz -dc "${{ matrix.image_name }}.img.xz" > "${{ matrix.image_name }}.img"
          sha256sum "${{ matrix.image_name }}.img" > "${{ matrix.image_name }}.img.sha256"
          stat -c%s "${{ matrix.image_name }}.img" > "${{ matrix.image_name }}.img.size"
          rm -f "${{ matrix.image_name }}.img"

          echo "Artifacts:"
          ls -la *.img.xz *.sha256 *.size

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.image_name }}
          path: |
            pi-gen/deploy/${{ matrix.image_name }}.img.xz
            pi-gen/deploy/*.sha256
            pi-gen/deploy/*.size

  release:
    needs: build-image
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Update os_list.json with generated hashes and sizes
        run: |
          python3 - <<'EOF'
          import json, os, glob

          with open("os_list.json", "r") as f:
              data = json.load(f)

          products = data.get("os_list", [{}])[0].get("subitems", [])

          for item in products:
              name = item.get("name", "")
              target_prefix = "hobbyticker-32bit" if "32-bit" in name else "hobbyticker-64bit"

              xz_hash_files = glob.glob(f"artifacts/**/{target_prefix}.img.xz.sha256", recursive=True)
              xz_size_files = glob.glob(f"artifacts/**/{target_prefix}.img.xz.size", recursive=True)
              raw_hash_files = glob.glob(f"artifacts/**/{target_prefix}.img.sha256", recursive=True)
              raw_size_files = glob.glob(f"artifacts/**/{target_prefix}.img.size", recursive=True)

              if xz_hash_files and os.path.exists(xz_hash_files[0]):
                  with open(xz_hash_files[0]) as hf:
                      item["image_download_sha256"] = hf.read().split()[0].strip()

              if xz_size_files and os.path.exists(xz_size_files[0]):
                  with open(xz_size_files[0]) as sf:
                      item["image_download_size"] = int(sf.read().strip())

              if raw_hash_files and os.path.exists(raw_hash_files[0]):
                  with open(raw_hash_files[0]) as hf:
                      item["extract_sha256"] = hf.read().split()[0].strip()

              if raw_size_files and os.path.exists(raw_size_files[0]):
                  with open(raw_size_files[0]) as sf:
                      item["extract_size"] = int(sf.read().strip())

          with open("os_list.json", "w") as f:
              json.dump(data, f, indent=2)

          print("Updated os_list.json successfully:")
          print(json.dumps(data, indent=2))
          EOF

      - name: Commit updated os_list.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add os_list.json
          git commit -m "Auto-update os_list.json checksums and sizes [skip ci]" || echo "No changes to commit"
          git push origin main || echo "Git push skipped or failed"

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: Hobby Ticker OS v1.0.0
          body: |
            # Hobby Ticker OS v1.0.0

            Prebuilt Raspberry Pi OS images with Hobby Ticker pre-installed.

            ## Available Images
            - **hobbyticker-32bit.img.xz** — For Raspberry Pi 3 (and Pi 4 / Pi Zero 2 W in 32-bit mode)
            - **hobbyticker-64bit.img.xz** — For Raspberry Pi 4 and Raspberry Pi 5 (64-bit mode)

            ## Flashing with Raspberry Pi Imager
            1. Open **Raspberry Pi Imager**
            2. Go to **App Options → Content Repository → Custom URL**
            3. Enter: `https://raw.githubusercontent.com/gvalles9/Hobby_Ticker_OS/main/os_list.json`
            4. Select **Hobby Ticker OS** from the menu
            5. Configure your Wi-Fi credentials and hostname
            6. Flash and boot!
          files: artifacts/**/*.img.xz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}